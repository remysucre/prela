[package]
name = "prela"
version = "0.1.0"
edition = "2024"
default-run = "prela"

[workspace]
members = ["macros"]

[dependencies]
prela-macros = { path = "macros" }
ahash    = "0.8"
memchr   = "2"
memmap2  = "0.9"
regex    = "1.10"
smallvec = "1"
parquet  = { version = "53", features = ["arrow"], optional = true }
arrow    = { version = "53", optional = true }

[features]
default = []
# `regen` binary needs parquet+arrow; everything else is dep-free.
regen   = ["parquet", "arrow"]
# The loaded TPC-H suite (tpch_queries::common_loaded, `prela tpch_loaded`).
# Separate from `regen` while that suite doesn't compile yet.
loaded  = ["regen"]
# The loaded JOB suite (job_queries::queries_loaded, `prela job_loaded`).
job_loaded = ["regen"]

[[bin]]
name = "prela"
path = "src/main.rs"

[[bin]]
name = "regen"
path = "src/bin/regen.rs"
required-features = ["regen"]

[[example]]
name = "tree_query"
required-features = ["regen"]

[[example]]
name = "testing"
required-features = ["regen"]

[[example]]
name = "runner"
required-features = ["regen"]

[profile.release]
lto = "fat"
codegen-units = 1
debug = true                     # keep symbols for `cargo asm` / perf
