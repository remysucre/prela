[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
prela = { path = "../../rust" }
harness = { path = "harness" }

# Correctness runs, not benchmarks: the batch crates stay cheap to rebuild
# while the dependencies (prela's engine included) are optimized once.
[profile.dev]
opt-level = 0
debug = 0
incremental = true

[profile.dev.package."*"]
opt-level = 2
